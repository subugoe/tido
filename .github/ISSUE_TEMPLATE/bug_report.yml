name: Bug report
description: Report a problem so we can fix it
title: "[Bug] "
labels: ["bug", "v5"]
type: Bug
body:
  - type: textarea
    id: description
    attributes:
      label: Short description
      description: A one- or two-sentence summary of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps needed to trigger the bug.
      placeholder: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: What happens instead? Include error messages or screenshots if helpful.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: What should have happened?
    validations:
      required: true
