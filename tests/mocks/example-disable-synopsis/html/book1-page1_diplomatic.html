    <h1>Island Chronicle — Chapter 1: The Harbour (Diplomatic)</h1>
    <p>The harbour of the island was built by the first settlers, whose <span id="multi">stone quays</span><span id="dipl-note"> [orig. stan quayes]</span> still bear the marks of their tools.</p>
    <p>Ships from euery nation found shelter here, and the market aboue the pier traded in salt, wooll and tales.</p>
